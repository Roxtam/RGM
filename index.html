<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2D3436" />
  <title>Roxtam Graphix — Business System</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar (desktop) -->
    <aside id="sidebar">
      <div class="brand">
        <img class="brand-logo" src="logo.png" alt="Roxtam Graphix logo" />
        <div>
          <div class="brand-name">ROXTAM GRAPHIX</div>
          <div class="brand-sub">Business System</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="conn-status" class="conn" data-state="unknown">
          <span class="dot"></span><span id="conn-text">Not connected</span>
        </div>
        <div class="sidebar-note">Google Sheets is the source of truth</div>
      </div>
    </aside>

    <!-- Main -->
    <main id="main">
      <header id="topbar">
        <button id="menu-btn" class="icon-btn" aria-label="Menu">☰</button>
        <h1 id="page-title">Dashboard</h1>
        <div class="topbar-right">
          <button id="quick-add" class="btn btn-primary btn-sm">+ New Order</button>
        </div>
      </header>
      <div id="view" class="view"><div class="loading"><div class="spinner"></div><p>Loading…</p></div></div>
    </main>

    <!-- Mobile bottom nav -->
    <nav id="bottom-nav"></nav>

    <!-- Drawer overlay (mobile) -->
    <div id="drawer-overlay" class="hidden"></div>

    <!-- Modal -->
    <div id="modal-overlay" class="hidden">
      <div id="modal" role="dialog" aria-modal="true">
        <div id="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="icon-btn" aria-label="Close">✕</button></div>
        <div id="modal-body"></div>
      </div>
    </div>

    <!-- Toast container -->
    <div id="toasts"></div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
